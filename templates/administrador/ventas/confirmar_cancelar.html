{% extends 'base.html' %}
{% block title %}| Cancelar venta{% endblock %}

{% block content %}
<section class="min-h-screen bg-gym-black pt-32 pb-20 px-6 sm:px-10 flex items-center justify-center">
  <div class="reveal max-w-md w-full bg-gym-surface border border-gym-red/30 rounded-2xl p-10 text-center">
    <div class="w-16 h-16 rounded-full bg-gym-red/10 flex items-center justify-center mx-auto mb-6">
      <i data-lucide="alert-triangle" class="w-8 h-8 text-gym-red"></i>
    </div>
    <h1 class="font-display text-3xl text-white tracking-wide mb-3">Cancelar venta</h1>
    <p class="text-white/50 text-sm mb-8">
      ¿Seguro que deseas cancelar la venta <strong class="text-white">#{{ venta.pk }}</strong> por
      <strong class="text-gym-gold">${{ venta.total }}</strong>?<br>
      Se devolverá el stock de todos los productos.
    </p>

    <form method="post" class="flex gap-4">
      {% csrf_token %}
      <button type="submit"
              class="flex-1 bg-gym-red hover:bg-red-700 text-white font-semibold py-3 rounded-lg uppercase tracking-wider transition-all duration-200">
        Sí, cancelar
      </button>
      <a href="{% url 'administrador:historial_ventas' %}"
         class="flex-1 text-center border border-white/20 text-white font-semibold py-3 rounded-lg uppercase tracking-wider hover:border-white/40 transition-all duration-200">
        Volver
      </a>
    </form>
  </div>
</section>
{% endblock %}
