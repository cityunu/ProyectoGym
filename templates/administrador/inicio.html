<div class="reveal grid grid-cols-1 sm:grid-cols-4 gap-4">
  <a href="{% url 'administrador:lista_productos' %}" class="text-center border border-white/20 text-white font-semibold py-4 rounded-lg uppercase tracking-wider text-sm hover:border-gym-red hover:text-gym-red transition-all duration-200">
    Productos
  </a>
  <a href="{% url 'administrador:gestionar_membresias' %}" class="text-center border border-white/20 text-white font-semibold py-4 rounded-lg uppercase tracking-wider text-sm hover:border-gym-red hover:text-gym-red transition-all duration-200">
    Membresías
  </a>
  <a href="{% url 'administrador:asignar_membresia' %}" class="text-center border {% if clientes_sin_membresia > 0 %}border-gym-gold/50 text-gym-gold{% else %}border-white/20 text-white{% endif %} font-semibold py-4 rounded-lg uppercase tracking-wider text-sm hover:border-gym-red hover:text-gym-red transition-all duration-200">
    Asignar membresía
    {% if clientes_sin_membresia > 0 %}<span class="block text-xs mt-1">{{ clientes_sin_membresia }} pendiente(s)</span>{% endif %}
  </a>
  <a href="{% url 'administrador:lector_qr' %}" class="text-center bg-gym-red hover:bg-red-700 text-white font-semibold py-4 rounded-lg uppercase tracking-wider text-sm transition-all duration-200">
    Escanear QR
  </a>
</div>
