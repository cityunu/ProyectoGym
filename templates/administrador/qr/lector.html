{% extends 'base.html' %}
{% block title %}| Lector QR{% endblock %}

{% block content %}
<section class="min-h-screen bg-gym-black pt-32 pb-20 px-6 sm:px-10 flex items-center justify-center">
  <div class="reveal max-w-md w-full bg-gym-surface border border-white/10 rounded-2xl p-8 text-center">
    <p class="text-gym-red text-sm font-semibold uppercase tracking-widest mb-2">Control de acceso</p>
    <h1 class="font-display text-3xl text-white tracking-wide mb-6">Escanear QR</h1>

    <div id="reader" class="rounded-xl overflow-hidden mb-6"></div>

    <div id="resultado" class="hidden rounded-xl p-5 text-left">
      <p id="resultado-mensaje" class="font-semibold mb-2"></p>
      <p id="resultado-detalle" class="text-white/60 text-sm"></p>
    </div>

    <button id="btn-reiniciar" class="hidden mt-4 w-full border border-white/20 text-white font-semibold py-3 rounded-lg uppercase tracking-wider text-sm hover:border-gym-red hover:text-gym-red transition-all duration-200">
      Escanear otro código
    </button>

    <a href="{% url 'administrador:inicio' %}" class="inline-block mt-8 text-sm font-semibold text-white/60 hover:text-gym-red uppercase tracking-wider">
      ← Volver al panel
    </a>
  </div>
</section>

<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
<script>
function getCookie(name) {
  const value = `; ${document.cookie}`;
  const parts = value.split(`; ${name}=`);
  if (parts.length === 2) return parts.pop().split(';').shift();
}

const csrftoken = getCookie('csrftoken');
let escaneando = true;

const html5QrCode = new Html5Qrcode("reader");

function onScanSuccess(decodedText) {
  if (!escaneando) return;
  escaneando = false;
  html5QrCode.pause();

  fetch("{% url 'administrador:verificar_qr' %}", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "X-CSRFToken": csrftoken,
    },
    body: JSON.stringify({ codigo: decodedText }),
  })
    .then(res => res.json())
    .then(data => {
      const resultado = document.getElementById('resultado');
      const mensaje = document.getElementById('resultado-mensaje');
      const detalle = document.getElementById('resultado-detalle');

      resultado.classList.remove('hidden');
      mensaje.textContent = data.mensaje;

      if (data.valido) {
        resultado.className = "rounded-xl p-5 text-left bg-green-900/30 border border-green-500/30";
        mensaje.className = "font-semibold mb-2 text-green-300";
        detalle.textContent = `Membresía: ${data.membresia} · Vence: ${data.vence}`;
      } else {
        resultado.className = "rounded-xl p-5 text-left bg-red-900/30 border border-red-500/30";
        mensaje.className = "font-semibold mb-2 text-red-300";
        detalle.textContent = '';
      }

      document.getElementById('btn-reiniciar').classList.remove('hidden');
    })
    .catch(() => {
      escaneando = true;
      html5QrCode.resume();
    });
}

html5QrCode.start(
  { facingMode: "environment" },
  { fps: 10, qrbox: 220 },
  onScanSuccess
);

document.getElementById('btn-reiniciar').addEventListener('click', () => {
  document.getElementById('resultado').classList.add('hidden');
  document.getElementById('btn-reiniciar').classList.add('hidden');
  escaneando = true;
  html5QrCode.resume();
});
</script>
{% endblock %}
